<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Battleground</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <script>
        function vote(movie) {
            fetch("/vote", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ movie: movie })
            }).then(response => response.json())
              .then(data => alert(data.message));
        }
    </script>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen">
    <div class="bg-gray-800 p-6 rounded-lg shadow-lg text-center w-96">
        <h1 class="text-2xl font-bold mb-4">Film Battleground</h1>
        {% if movie1 and movie2 %}
            <h2 class="text-lg mb-4">Hangi film daha iyi?</h2>
            <div class="flex justify-between">
                <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-1/2 mx-1" onclick="vote('{{ movie1 }}')">{{ movie1 }}</button>
                <button class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded w-1/2 mx-1" onclick="vote('{{ movie2 }}')">{{ movie2 }}</button>
            </div>
        {% else %}
            <p class="text-gray-400">Film seçimi yapılmadı.</p>
        {% endif %}
    </div>
</body>
</html>
