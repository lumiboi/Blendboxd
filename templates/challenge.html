<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Challenge</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Film Challenge</h1>
        <div id="film-selection">
            <h3>Film Seç</h3>
            <input type="text" id="film1-search" placeholder="Film 1 Seçiniz" onkeyup="searchFilms('film1')">
            <input type="text" id="film2-search" placeholder="Film 2 Seçiniz" onkeyup="searchFilms('film2')">
            <div id="film1-info"></div>
            <div id="film2-info"></div>
        </div>

        <div id="selected-films" class="selected-films">
            <!-- Seçilen Filmler Burada Gösterilecek -->
        </div>

        <button id="generate-url" onclick="showChallengeUrl()">Arkadaşına Meydan Oku</button>

        <!-- Benzersiz URL Bölümü -->
        <div id="challenge-section" style="display: none;">
            <label for="challenge-url">Benzersiz URL:</label>
            <input type="text" id="challenge-url" readonly>
        </div>

    </div>

    <script>
        let selectedFilm1 = null;
        let selectedFilm2 = null;

        // Film arama fonksiyonu (TMDB API'sinden veri çekme)
        function searchFilms(filmNumber) {
            let searchQuery = document.getElementById(filmNumber + '-search').value;
            if (searchQuery.length < 3) return;  // Kullanıcı 3 karakter yazana kadar bekleyelim

            fetch(`https://api.themoviedb.org/3/search/movie?api_key=f3abc39a6d4fbdcc0b2a79906b528658&query=${searchQuery}`)
                .then(response => response.json())
                .then(data => {
                    const films = data.results;
                    if (films.length > 0) {
                        let film = films[0];  // İlk filmi alıyoruz
                        const filmInfoDiv = document.getElementById(filmNumber + '-info');
                        filmInfoDiv.innerHTML = `
                            <h4>${film.title}</h4>
                            <p>Yönetmen: ${film.director || 'Bilinmiyor'}</p>
                            <p>Puan: ${film.vote_average}</p>
                            <p>Özet: ${film.overview}</p>
                            <img src="https://image.tmdb.org/t/p/w500${film.poster_path}" alt="${film.title}">
                        `;
                        if (filmNumber === 'film1') {
                            selectedFilm1 = film;
                        } else {
                            selectedFilm2 = film;
                        }
                    }
                })
                .catch(error => console.log('Error:', error));
        }

        // Benzersiz URL oluşturma fonksiyonu
        function generateUniqueId() {
            const film1Id = selectedFilm1 ? selectedFilm1.id : '';
            const film2Id = selectedFilm2 ? selectedFilm2.id : '';
            return `${film1Id}-${film2Id}-${Math.random().toString(36).substr(2, 9)}`;
        }

        // Arkadaşına meydan oku butonu
        function showChallengeUrl() {
            if (!selectedFilm1 || !selectedFilm2) {
                alert('Lütfen iki film seçin!');
                return;
            }

            const challengeLink = window.location.origin + "/challenge/" + generateUniqueId();
            document.getElementById('challenge-url').value = challengeLink;
            document.getElementById('challenge-section').style.display = 'block';
        }
    </script>
</body>
</html>
