<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Karşılaştırma ve Oylama</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .movie-container {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        .movie-details {
            text-align: center;
            width: 45%;
        }
        .movie-details img {
            max-width: 100%;
            height: auto;
        }
        .vote-buttons {
            text-align: center;
            margin: 20px 0;
        }
        .vote-results, .leaderboard {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Film Karşılaştırma ve Oylama</h1>

    <!-- Film Arama ve Seçme -->
    <div>
        <input type="text" id="movie1" placeholder="Film 1 Ara">
        <input type="text" id="movie2" placeholder="Film 2 Ara">
        <button id="compareButton">Karşılaştır</button>
    </div>

    <!-- Film Detayları -->
    <div class="movie-container">
        <div id="movie1Details" class="movie-details"></div>
        <div id="movie2Details" class="movie-details"></div>
    </div>

    <!-- Oylama Butonları -->
    <div class="vote-buttons">
        <button id="voteMovie1">Film 1'i Seç</button>
        <button id="voteMovie2">Film 2'i Seç</button>
    </div>

    <!-- Oylama Sonuçları -->
    <div id="voteResults" class="vote-results"></div>

    <!-- Arkadaşına Meydan Okuma -->
    <div>
        <button id="challengeFriend">Arkadaşına Meydan Oku</button>
        <p id="copyMessage" style="color: green; display: none;">Link kopyalandı!</p>
    </div>

    <!-- Leaderboard -->
    <div id="leaderboard" class="leaderboard">
        <h2>Kazananlar Listesi</h2>
    </div>

    <script>
        const TMDB_API_KEY = "f3abc39a6d4fbdcc0b2a79906b528658";
        const TMDB_BASE_URL = "https://api.themoviedb.org/3";

        let selectedMovie1 = null;
        let selectedMovie2 = null;
        let movie1Votes = 0;
        let movie2Votes = 0;
        let leaderboard = JSON.parse(localStorage.getItem('leaderboard')) || {};

        // TMDB'den film arama
        async function searchMovies(query) {
            const url = `${TMDB_BASE_URL}/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`;
            const response = await fetch(url);
            const data = await response.json();
            return data.results;
        }

        // TMDB'den film detaylarını getirme
        async function getMovieDetails(movieId) {
            const url = `${TMDB_BASE_URL}/movie/${movieId}?api_key=${TMDB_API_KEY}`;
            const response = await fetch(url);
            const data = await response.json();
            return data;
        }

        // Film önerilerini gösterme
        async function showMovieSuggestions(inputElement, movieDetailsElement) {
            const query = inputElement.value;
            if (query.length > 2) {
                const movies = await searchMovies(query);
                if (movies.length > 0) {
                    const firstMovie = movies[0];
                    const details = await getMovieDetails(firstMovie.id);
                    movieDetailsElement.innerHTML = `
                        <h2>${details.title}</h2>
                        <img src="https://image.tmdb.org/t/p/w500${details.poster_path}" alt="${details.title}">
                        <p>${details.overview}</p>
                    `;
                    if (inputElement.id === "movie1") {
                        selectedMovie1 = { id: details.id, title: details.title };
                    } else {
                        selectedMovie2 = { id: details.id, title: details.title };
                    }
                }
            }
        }

        // Oylama sonuçlarını güncelleme
        function updateVoteResults() {
            const totalVotes = movie1Votes + movie2Votes;
            const movie1Percentage = totalVotes > 0 ? (movie1Votes / totalVotes) * 100 : 0;
            const movie2Percentage = totalVotes > 0 ? (movie2Votes / totalVotes) * 100 : 0;

            document.getElementById('voteResults').innerHTML = `
                <p>Film 1: ${movie1Votes} oy (${movie1Percentage.toFixed(2)}%)</p>
                <p>Film 2: ${movie2Votes} oy (${movie2Percentage.toFixed(2)}%)</p>
            `;
        }

        // Leaderboard'u güncelleme
        function updateLeaderboard(movie) {
            if (leaderboard[movie.id]) {
                leaderboard[movie.id].wins++;
            } else {
                leaderboard[movie.id] = { title: movie.title, wins: 1 };
            }
            localStorage.setItem('leaderboard', JSON.stringify(leaderboard));
            displayLeaderboard();
        }

        // Link kopyalama
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                document.getElementById('copyMessage').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('copyMessage').style.display = 'none';
                }, 3000);
            });
        }

        // Meydan okuma oluştur
        async function createChallenge() {
            if (selectedMovie1 && selectedMovie2) {
                const response = await fetch('/create_challenge', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        movie1_id: selectedMovie1.id,
                        movie2_id: selectedMovie2.id,
                    }),
                });
                const data = await response.json();
                if (data.success) {
                    copyToClipboard(data.challenge_url);
                }
            } else {
                alert("Lütfen önce iki film seçin.");
            }
        }

        // Event Listeners
        document.getElementById('movie1').addEventListener('input', async (e) => {
            await showMovieSuggestions(e.target, document.getElementById('movie1Details'));
        });

        document.getElementById('movie2').addEventListener('input', async (e) => {
            await showMovieSuggestions(e.target, document.getElementById('movie2Details'));
        });

        document.getElementById('voteMovie1').addEventListener('click', () => {
            if (selectedMovie1) {
                movie1Votes++;
                updateVoteResults();
                updateLeaderboard(selectedMovie1);
            }
        });

        document.getElementById('voteMovie2').addEventListener('click', () => {
            if (selectedMovie2) {
                movie2Votes++;
                updateVoteResults();
                updateLeaderboard(selectedMovie2);
            }
        });

        document.getElementById('challengeFriend').addEventListener('click', createChallenge);

        // Sayfa yüklendiğinde leaderboard'u göster
        displayLeaderboard();
    </script>
</body>
</html>
