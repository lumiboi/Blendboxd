<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Film Battleground</title>
</head>
<body>
    <h1>Film Battleground</h1>
    <div>
        <h2>{{ film1.title }}</h2>
        <img src="{{ film1.poster }}" alt="{{ film1.title }}" width="200">
        <p>{{ film1.overview }}</p>
        <form action="/vote" method="POST">
            <input type="hidden" name="winner" value="{{ film1.id }}">
            <input type="hidden" name="loser" value="{{ film2.id }}">
            <button type="submit">Vote for {{ film1.title }}</button>
        </form>
    </div>
    <div>
        <h2>{{ film2.title }}</h2>
        <img src="{{ film2.poster }}" alt="{{ film2.title }}" width="200">
        <p>{{ film2.overview }}</p>
        <form action="/vote" method="POST">
            <input type="hidden" name="winner" value="{{ film2.id }}">
            <input type="hidden" name="loser" value="{{ film1.id }}">
            <button type="submit">Vote for {{ film2.title }}</button>
        </form>
    </div>
</body>
</html>
