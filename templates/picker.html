<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Picker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0a0a0a;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #14181c;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 350px;
        }
        h1 {
            margin-bottom: 20px;
            color: #00b7a4;
        }
        input {
            padding: 10px;
            border-radius: 6px;
            border: none;
            margin: 5px 0;
            width: 100%;
        }
        button {
            padding: 10px;
            border-radius: 6px;
            border: none;
            background-color: #00b7a4;
            color: white;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #008a7a;
        }
        .movie-display {
            margin-top: 20px;
            height: 300px; /* Adjust as needed */
            overflow-y: auto;
        }
        .movie-display img {
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .loading {
            display: none;
            margin-top: 10px;
        }
        .loading .spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Trackbar for movie count */
        .trackbar-container {
            width: 100%;
            margin: 10px 0;
        }
        .trackbar {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 10px;
            border-radius: 5px;
            background: #d3d3d3;
            outline: none;
            opacity: 0.7;
            -webkit-transition: .2s;
            transition: opacity .2s;
        }
        .trackbar:hover {
            opacity: 1;
        }
        .trackbar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00b7a4;
            cursor: pointer;
        }
        .trackbar::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00b7a4;
            cursor: pointer;
        }
        #movieCountDisplay {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Random Film Seçici!</h1>
        <h6>Letterboxd Watchlist'inizden Rastgele Film Seçer.</h6>
        <form id="moviePickerForm">
            <input type="text" id="username" placeholder="Letterboxd Kullanıcı Adı" required>
            <div class="trackbar-container">
                <input type="range" min="1" max="10" value="1" class="trackbar" id="movieCount">
                <p id="movieCountDisplay">1 Film</p>
            </div>
            <button type="submit">Film Seç</button>
        </form>
        <div class="loading" id="loading">
            <div class="spinner"><i class="fas fa-circle-notch fa-spin fa-2x"></i></div>
        </div>
        <div class="movie-display" id="movieDisplay"></div>
    </div>

    <script>
        const trackbar = document.getElementById('movieCount');
        const countDisplay = document.getElementById('movieCountDisplay');

        trackbar.addEventListener('input', function() {
            countDisplay.textContent = `${this.value} Film`;
        });

        document.getElementById('moviePickerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const count = document.getElementById('movieCount').value;
            document.getElementById('loading').style.display = 'block';
            fetch('/pick_movies', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `username=${encodeURIComponent(username)}&count=${count}`
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                let output = '';
                data.forEach(movie => {
                    output += `<img src="${movie.poster}" alt="${movie.title}"><br><p>${movie.title}</p>`;
                });
                document.getElementById('movieDisplay').innerHTML = output;
            });
        });
    </script>
</body>
</html>
