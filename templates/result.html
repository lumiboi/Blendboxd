<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLEND SONUCU!</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0a0a0a;
            margin: 0;
            padding: 0;
            color: #fff;
            overflow: hidden;
        }

        .background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .background-video iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .container {
            background-color: rgba(20, 24, 28, 0.9);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
            width: 350px;
            text-align: center;
            color: white;
            overflow-y: auto;
            max-height: 80vh;
            position: relative;
            margin: 20px auto;
            z-index: 1;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #00b7a4;
        }

        h2 {
            margin-bottom: 10px;
            color: #ff8000;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }

        li {
            background: #1e272e;
            margin: 5px 0;
            padding: 10px;
            border-radius: 6px;
            color: #fff;
        }

        .button {
            margin-top: 20px;
            background-color: #00b7a4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .button:hover {
            background-color: #008a7a;
        }
    </style>
</head>
<body>
    <!-- Arka Plan Videosu -->
    <div class="background-video">
        <iframe 
            src="https://streamable.com/e/e4v7f0?autoplay=1" 
            frameborder="0" 
            allow="autoplay; fullscreen" 
            allowfullscreen>
        </iframe>
    </div>

    <!-- Ana İçerik -->
    <div class="container">
        <h1 id="header">{{ username1 }} ve {{ username2 }} için Watchbox!</h1>
        <h2>WATCHBOX:</h2>
        <ul id="movieList">
            {% if common_movies %}
                {% for movie in common_movies %}
                    <li>{{ movie.title }}</li>
                {% endfor %}
            {% else %}
                <li>Hiç ortak film bulunamadı.</li>
            {% endif %}
        </ul>
        <div class="compatibility" id="compatibility">
            Uyum Oranı: {{ compatibility_percentage | round(2) }}%
        </div>
        <button class="button" id="downloadBtn">JPG Olarak İndir</button>
    </div>
    <footer>
        <p>© 2024 Mert Ergün</p>
    </footer>

    <script>
        document.getElementById('downloadBtn').addEventListener('click', function () {
            const username1 = "{{ username1 }}";
            const username2 = "{{ username2 }}";
            const movies = Array.from(document.querySelectorAll('#movieList li')).map(li => li.textContent);
            const compatibility = "{{ compatibility_percentage | round(2) }}%";

            // Canvas Ayarları
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            const width = 800;
            const height = 600;

            canvas.width = width;
            canvas.height = height;

            // Arka Plan Rengi
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, width, height);

            // Başlık
            ctx.fillStyle = '#00b7a4';
            ctx.font = 'bold 24px Helvetica';
            ctx.fillText(`${username1} ve ${username2} için Watchbox`, 50, 50);

            // Filmler
            ctx.fillStyle = '#ffffff';
            ctx.font = '16px Helvetica';
            ctx.fillText('Filmler:', 50, 100);

            movies.forEach((movie, index) => {
                ctx.fillText(`${index + 1}. ${movie}`, 50, 130 + index * 20);
            });

            // Uyum Oranı
            ctx.fillStyle = '#ff8000';
            ctx.font = '18px Helvetica';
            ctx.fillText(`Uyum Oranı: ${compatibility}`, 50, height - 50);

            // Görseli İndirme
            const link = document.createElement('a');
            link.download = 'watchbox.jpg';
            link.href = canvas.toDataURL('image/jpeg');
            link.click();
        });
    </script>
</body>
</html>
