<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLEND SONUCU!</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #fff;
            overflow: auto;
            background: url('https://i.ibb.co/VNSHSXD/EWS-ezgif-com-optimize.gif') no-repeat center center fixed;
            background-size: cover;
        }

        .container {
            background-color: rgba(20, 24, 28, 0.9);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
            width: 350px;
            text-align: center;
            color: white;
            margin: 20px auto;
            overflow-y: auto;
            max-height: 90vh;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #00b7a4;
        }

        h2 {
            margin-bottom: 10px;
            color: #ff8000;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 50vh;
            overflow-y: auto;
            text-align: center; /* Ortala */
        }

        li {
            background: #1e272e;
            margin: 5px 0;
            padding: 10px;
            border-radius: 6px;
            color: #fff;
        }

        .button {
            margin-top: 20px;
            background-color: #00b7a4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .button:hover {
            background-color: #008a7a;
        }

        .link {
            display: block;
            margin-top: 10px;
            text-decoration: none;
            color: #00b7a4;
            font-weight: bold;
        }

        .link:hover {
            text-decoration: underline;
        }

        #compatibility {
            color: #ff8000;
            font-size: 24px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Ana İçerik -->
    <div class="container">
        <h1 id="header">{{ username1 }} ve {{ username2 }} için Watchbox!</h1>
        <h2>WATCHBOX:</h2>
        <ul id="movieList">
            {% if common_movies %}
                {% for movie in common_movies %}
                     <li>{{ movie }}</li>
                {% endfor %}
            {% else %}
                <li>Hiç ortak film bulunamadı.</li>
            {% endif %}
        </ul>
        <div id="compatibility">Uyum Oranı: {{ compatibility_percentage | round(2) }}%</div>
        <button class="button" id="downloadBtn">Canvas Olarak İndir</button>
        <button class="button" id="downloadInstagramStoryBtn">Canvas Olarak İndir (Instagram Story)</button>
        <a href="/" class="link">Yeni kullanıcı adları gir</a>
    </div>

    <script>
        document.getElementById('downloadBtn').addEventListener('click', function () {
            const username1 = "{{ username1 }}";
            const username2 = "{{ username2 }}";
            const movies = Array.from(document.querySelectorAll('#movieList li')).map(li => li.textContent);
            const compatibility = "{{ compatibility_percentage | round(2) }}%";

            // Dinamik Canvas Boyutu
            const canvasWidth = 1920;
            const canvasHeight = 1080;
            const itemsPerColumn = 5; // 5 film her sütunda
            const columnWidth = 350; // Geniş sütun
            const rowHeight = 40; // Yüksek satır

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;

            // Arka Plan - Letterboxd Temalı
            const gradient = ctx.createLinearGradient(0, 0, canvasWidth, canvasHeight);
            gradient.addColorStop(0, '#121212'); // Siyah gri
            gradient.addColorStop(0.5, '#333333'); // Koyu gri
            gradient.addColorStop(1, '#121212'); // Siyah gri
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            // Başlık - Gradyan Renk
            const titleGradient = ctx.createLinearGradient(0, 0, canvasWidth, 0);
            titleGradient.addColorStop(0, '#ff8000');
            titleGradient.addColorStop(0.5, '#00e054');
            titleGradient.addColorStop(1, '#40bcf4');
            ctx.fillStyle = titleGradient;
            ctx.font = 'bold 48px "Helvetica Neue", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`${username1} ve ${username2} için 100 filmlik Watchbox!`, canvasWidth / 2, 80);

            // Filmler - Yeni Gradyan Renk
            const movieGradient = ctx.createLinearGradient(0, 0, canvasWidth, 0);
            movieGradient.addColorStop(0, '#40bcf4');
            movieGradient.addColorStop(0.5, '#ff8000');
            movieGradient.addColorStop(1, '#00e054');
            ctx.fillStyle = movieGradient;
            ctx.font = '22px "Helvetica Neue", sans-serif';
            let x = 100;
            let y = 120;

            movies.slice(0, 100).forEach((movie, index) => {
                if (y + rowHeight > canvasHeight - 150) {
                    x += columnWidth;
                    y = 120;
                }
                ctx.fillText(`${index + 1}. ${movie}`, x + (columnWidth / 2), y); // Centered text
                y += rowHeight;
            });

            // Uyum Oranı - Yeni Gradyan Renk
            const compatibilityGradient = ctx.createLinearGradient(0, 0, canvasWidth, 0);
            compatibilityGradient.addColorStop(0, '#40bcf4');
            compatibilityGradient.addColorStop(0.5, '#ff8000');
            compatibilityGradient.addColorStop(1, '#00e054');
            ctx.fillStyle = compatibilityGradient;
            ctx.font = 'bold 36px "Helvetica Neue", sans-serif';
            ctx.fillText(`Uyum Oranı: ${compatibility}`, canvasWidth / 2, canvasHeight - 80); // Centered compatibility

            // "Siz de kendi Watchbox'unuzu oluşturmak için blendboxd.up.railway.app'i ziyaret edebilirsiniz!" yazısı
            const linkGradient = ctx.createLinearGradient(0, canvasHeight - 20, canvasWidth, canvasHeight);
            linkGradient.addColorStop(0, '#ff8000');
            linkGradient.addColorStop(0.5, '#00e054');
            linkGradient.addColorStop(1, '#40bcf4');
            ctx.fillStyle = linkGradient;
            ctx.font = 'italic 24px "Helvetica Neue", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Siz de kendi Watchbox\'unuzu oluşturmak için blendboxd.up.railway.app\'i ziyaret edebilirsiniz!', canvasWidth / 2, canvasHeight - 20);

            // Görseli İndirme
            const link = document.createElement('a');
            link.download = 'watchbox.jpg';
            link.href = canvas.toDataURL('image/jpeg');
            link.click();
        });

        document.getElementById('downloadInstagramStoryBtn').addEventListener('click', function () {
            const username1 = "{{ username1 }}";
            const username2 = "{{ username2 }}";
            const movies = Array.from(document.querySelectorAll('#movieList li')).map(li => li.textContent);
            const compatibility = "{{ compatibility_percentage | round(2) }}%";

            // Instagram Story boyutları
            const canvasWidth = 1080;
            const canvasHeight = 1920;
            const itemsPerColumn = 5; // 5 film her sütunda
            const columnWidth = 350; // Geniş sütun
            const rowHeight = 80; // Yüksek satır (50 film sonrası boşluk azaltıldı)

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;

            // Arka Plan - Letterboxd Temalı
            const gradient = ctx.createLinearGradient(0, 0, canvasWidth, canvasHeight);
            gradient.addColorStop(0, '#121212'); // Siyah gri
            gradient.addColorStop(0.5, '#333333'); // Koyu gri
            gradient.addColorStop(1, '#121212'); // Siyah gri
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            // Başlık - Gradyan Renk
            const titleGradient = ctx.createLinearGradient(0, 0, canvasWidth, 0);
            titleGradient.addColorStop(0, '#ff8000');
            titleGradient.addColorStop(0.5, '#00e054');
            titleGradient.addColorStop(1, '#40bcf4');
            ctx.fillStyle = titleGradient;
            ctx.font = 'bold 48px "Helvetica Neue", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`${username1} ve ${username2} için 50 filmlik Watchbox!`, canvasWidth / 2, 80);

            // Filmler - Yeni Gradyan Renk
            const movieGradient = ctx.createLinearGradient(0, 0, canvasWidth, 0);
            movieGradient.addColorStop(0, '#40bcf4');
            movieGradient.addColorStop(0.5, '#ff8000');
            movieGradient.addColorStop(1, '#00e054');
            ctx.fillStyle = movieGradient;
            ctx.font = '22px "Helvetica Neue", sans-serif';
            let x = 100;
            let y = 120;

            movies.slice(0, 50).forEach((movie, index) => {
                if (y + rowHeight > canvasHeight - 150) {
                    x += columnWidth;
                    y = 120;
                }
                ctx.fillText(`${index + 1}. ${movie}`, x + (columnWidth / 2), y); // Centered text
                y += rowHeight;
            });

            // Uyum Oranı - Yeni Gradyan Renk
            const compatibilityGradient = ctx.createLinearGradient(0, 0, canvasWidth, 0);
            compatibilityGradient.addColorStop(0, '#40bcf4');
            compatibilityGradient.addColorStop(0.5, '#ff8000');
            compatibilityGradient.addColorStop(1, '#00e054');
            ctx.fillStyle = compatibilityGradient;
            ctx.font = 'bold 36px "Helvetica Neue", sans-serif';
            ctx.fillText(`Uyum Oranı: ${compatibility}`, canvasWidth / 2, canvasHeight - 80); // Centered compatibility

            // "Siz de kendi Watchbox'unuzu oluşturmak için blendboxd.up.railway.app'i ziyaret edebilirsiniz!" yazısı
            const linkGradient = ctx.createLinearGradient(0, canvasHeight - 20, canvasWidth, canvasHeight);
            linkGradient.addColorStop(0, '#ff8000');
            linkGradient.addColorStop(0.5, '#00e054');
            linkGradient.addColorStop(1, '#40bcf4');
            ctx.fillStyle = linkGradient;
            ctx.font = 'italic 24px "Helvetica Neue", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Siz de kendi Watchbox\'unuzu oluşturmak için blendboxd.up.railway.app\'i ziyaret edebilirsiniz!', canvasWidth / 2, canvasHeight - 20);

            // Görseli İndirme
            const link = document.createElement('a');
            link.download = 'watchbox_instagram_story.jpg';
            link.href = canvas.toDataURL('image/jpeg');
            link.click();
        });
    </script>
</body>
</html>
