<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonuçlar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0a0a0a;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        .background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .background-video iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .volume-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            padding: 10px;
            z-index: 9999;
            color: white;
        }

        .volume-control input[type="range"] {
            margin-left: 10px;
            width: 150px;
        }

        .container {
            background-color: rgba(20, 24, 28, 0.9);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
            width: 350px;
            text-align: center;
            color: white;
            overflow-y: auto;
            max-height: 80vh;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #00b7a4;
        }

        h2 {
            margin-bottom: 10px;
            color: #ff8000;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }

        li {
            background: #1e272e;
            margin: 5px 0;
            padding: 10px;
            border-radius: 6px;
            color: #fff;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #00b7a4;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        footer {
            font-size: 12px;
            color: #777;
            margin-top: 20px;
        }

        .compatibility {
            margin: 20px 0;
            font-size: 18px;
            color: #ff8000;
        }
    </style>
</head>
<body>
    <!-- Dailymotion Arka Plan Videosu -->
    <div class="background-video">
        <iframe 
            id="videoIframe"
            src="https://geo.dailymotion.com/player.html?loop=true&video=x82hnx2" 
            frameborder="0" 
            allow="autoplay; fullscreen" 
            allowfullscreen>
        </iframe>
    </div>

    <!-- Ses Kontrol Çubuğu -->
    <div class="volume-control">
        <label for="volumeRange">Ses:</label>
        <input id="volumeRange" type="range" min="0" max="100" value="100">
    </div>

    <script>
        const volumeSlider = document.getElementById('volumeRange');
        const iframe = document.getElementById('videoIframe');

        // Dailymotion API'yi kullanarak ses seviyesini kontrol et
        volumeSlider.addEventListener('input', function () {
            const volume = volumeSlider.value / 100; // Ses seviyesini 0-1 arasında ayarla
            iframe.contentWindow.postMessage({
                command: 'volume',
                value: volume
            }, '*');
        });
    </script>
</body>
</html>
