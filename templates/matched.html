<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sonuçlar</title>
</head>
<body>
    <h1>En Uyumlu Arkadaş: {{ buddy_username }}</h1>
    <p>Uyum Yüzdesi: {{ compatibility_percentage }}%</p>

    <h2>Ortak Filmler (maks 100)</h2>
    <ul>
        {% for movie in common_movies %}
            <li>{{ movie }}</li>
        {% endfor %}
    </ul>

    <h2>Önerilen Filmler (maks 50)</h2>
    <ul>
        {% for movie in buddy_recommendations %}
            <li>{{ movie }}</li>
        {% endfor %}
    </ul>
</body>
</html>
