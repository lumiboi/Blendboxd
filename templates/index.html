<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blendboxd</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: url('https://64.media.tumblr.com/2145eef08016412758296c6315fce26b/tumblr_mox6v9erEP1rsyukao1_1280.gif') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }
        .container {
            background-color: rgba(20, 24, 28, 0.8);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 350px;
        }
        h1 {
            margin-bottom: 20px;
            color: #00b7a4;
        }
        input {
            padding: 10px;
            border-radius: 6px;
            border: none;
            margin: 5px 0;
            width: 100%;
        }
        button {
            padding: 10px;
            border-radius: 6px;
            border: none;
            background-color: #00b7a4;
            color: white;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #008a7a;
        }
        .language-selector {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 5px 10px;
            border-radius: 6px;
            color: white;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .language-selector i {
            margin-right: 5px;
        }
        .loading {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            color: #fff;
            text-align: center;
            z-index: 10;
        }
        .loading .spinner {
            margin-bottom: 10px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="language-selector" id="languageSelector">
        <i class="fas fa-globe"></i><span id="languageText">Dil: Türkçe</span>
    </div>

    <div class="container">
        <h1>Blendboxd</h1>
        <h3 id="description">Blender'ın çalışması ve watchbox oluşturulması için iki kullanıcının bilgilerini girelim...</h3>
        <form id="userForm" method="POST">
            <input type="text" name="username1" id="username1" placeholder="Kullanıcı Adı 1" required>
            <input type="text" name="username2" id="username2" placeholder="Kullanıcı Adı 2" required>
            <button type="submit">Blender'la!</button>
        </form>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"><i class="fas fa-circle-notch fa-spin fa-2x"></i></div>
        <p id="loadingText">Blender çalışıyor... </p>
    </div>

    <script>
        const form = document.getElementById('userForm');
        const loading = document.getElementById('loading');
        const languageSelector = document.getElementById('languageSelector');
        const languageText = document.getElementById('languageText');
        const description = document.getElementById('description');
        const loadingText = document.getElementById('loadingText');
        const username1Input = document.getElementById('username1');
        const username2Input = document.getElementById('username2');
        
        let language = 'tr'; // Default language is Turkish
        
        form.addEventListener('submit', function() {
            loading.style.display = 'block'; // Yükleme ekranını göster
        });

        languageSelector.addEventListener('click', function() {
            if (language === 'tr') {
                language = 'en';
                languageText.textContent = 'Language: English';
                description.textContent = 'Let\'s enter the details of two users to run the blender and create the watchbox...';
                loadingText.textContent = 'Blender is working...';
                username1Input.placeholder = 'Username 1';
                username2Input.placeholder = 'Username 2';
            } else {
                language = 'tr';
                languageText.textContent = 'Dil: Türkçe';
                description.textContent = 'Blender\'ın çalışması ve watchbox oluşturulması için iki kullanıcının bilgilerini girelim...';
                loadingText.textContent = 'Blender çalışıyor...';
                username1Input.placeholder = 'Kullanıcı Adı 1';
                username2Input.placeholder = 'Kullanıcı Adı 2';
            }
        });
    </script>
</body>
</html>
