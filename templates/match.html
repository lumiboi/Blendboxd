<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Film Tadım Arkadaşını Bul</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1c1c1c; color: #eee; text-align: center; padding: 50px; }
        input { padding: 10px; width: 250px; margin: 10px 0; border-radius: 5px; border: none; }
        button { padding: 10px 20px; border-radius: 5px; border: none; background-color: #ff6f61; color: #fff; cursor: pointer; }
        button:hover { background-color: #ff4a3a; }
        h1 { margin-bottom: 30px; }
    </style>
</head>
<body>
    <h1>Film Tadım Arkadaşını Bul</h1>
    <form method="POST" action="/matched">
        <input type="text" name="username" placeholder="Letterboxd kullanıcı adı" required>
        <br>
        <button type="submit">Bul</button>
    </form>
</body>
</html>
