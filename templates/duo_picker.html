{% extends "base.html" %}

{% block title %}{{ translations.group_movie_picker }}{% endblock %}

{% block extra_head %}
    <style>
        body {
              background: url('https://i.giphy.com/g1n3pswjr0ouc.webp') no-repeat center center fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
            background-color: #181818;
            color: #FFFFFF;
            margin: 0;
            padding: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #242424;
            padding: 10px 20px;
            border-bottom: 2px solid #40bcf4;
            opacity: 0.85;
        }

        header select {
            background-color: #242424;
            color: #FFFFFF;
            border: 1px solid #40bcf4;
            padding: 5px;
            border-radius: 5px;
        }

        h1 {
            color: #40bcf4;
            font-size: 2rem;
        }

        form {
            margin: 20px auto;
            padding: 20px;
            max-width: 600px;
            background-color: #242424;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            opacity: 0.85;
        }

        form label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        form input, form button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: none;
        }

        form input {
            background-color: #303030;
            color: #FFFFFF;
        }

        form button {
            background-color: #40bcf4;
            color: #FFFFFF;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        form button:hover {
            background-color: #A3E635;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin-bottom: 20px;
            text-align: center;
        }

        li img {
            max-width: 100%;
            border-radius: 10px;
        }
    </style>
{% endblock %}

{% block content %}
    <header>
            <a href="/" style="display: inline-block; margin-top: 20px; text-decoration: none; background-color: #00e054; color: #FFFFFF; padding: 10px 20px; font-size: 1rem; border-radius: 5px; cursor: pointer; transition: background-color 0.3s ease; text-align: center;">
    <span>{{ translations.main_page }}</span>
</a>
<br> <br>
    </header>
    <main>
        <form method="POST" action="/duo_picker">
            <h3>{{ translations.group_movie_picker }}</h3> <br>
            <label for="user_count">{{ translations.number_of_users }}:</label>
            <input type="range" id="user_count" name="user_count" min="1" max="5" value="1" oninput="updateUserInputs(this.value)">
            <span id="user_count_label">1</span>
            <div id="user_inputs">
                <label for="username1">{{ translations.username }} 1:</label>
                <input type="text" id="username1" name="username1" required>
            </div>
            <label for="film_count">{{ translations.number_of_films }}:</label>
            <input type="number" id="film_count" name="film_count" min="1" value="1" required>
            <button type="submit">{{ translations.fetch_movies }}</button>
       
        </form>
    </main>
{% endblock %}

{% block extra_scripts %}
    <script>
        function updateUserInputs(count) {
            document.getElementById('user_count_label').innerText = count;
            const userInputsDiv = document.getElementById('user_inputs');
            userInputsDiv.innerHTML = '';
            for (let i = 1; i <= count; i++) {
                const label = document.createElement('label');
                label.setAttribute('for', `username${i}`);
                label.textContent = `{{ translations.username }} ${i}:`;
                const input = document.createElement('input');
                input.type = 'text';
                input.id = `username${i}`;
                input.name = `username${i}`;
                input.required = true;
                userInputsDiv.appendChild(label);
                userInputsDiv.appendChild(input);
            }
        }
    </script>
{% endblock %}
